name: Quickstart Integration Suite

on:
  push:
  pull_request:

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Quickstart suite (fails on skipped tests)
        run: scripts/runQuickstartSuite.sh
