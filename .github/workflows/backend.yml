name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qyou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qyou_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: npx --workspace=@qyou/api prisma db push --skip-generate

      - name: TypeCheck
        run: npm run typecheck -w @qyou/api

      - name: Lint
        run: npm run lint -w @qyou/api

      - name: OpenAPI spec check
        run: npm run openapi:check -w @qyou/api

      - name: Test
        run: npm run test -w @qyou/api

      - name: Test Coverage
        run: npm run test:coverage -w @qyou/api

      - name: Build
        run: npm run build -w @qyou/api
        # Hardened: explicit timeout, explicit shell, error annotation below
        continue-on-error: false
