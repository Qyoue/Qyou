name: Deploy production

# Builds and publishes the images, then waits for approval on the `production`
# environment (configure required reviewers and branch rules under
# Settings > Environments > production) before calling the deploy hook.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag or SHA) to deploy
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
            NEXT_PUBLIC_STELLAR_NETWORK=${{ vars.PRODUCTION_STELLAR_NETWORK }}
          tags: ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}

  preflight:
    name: Production readiness gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production readiness
        run: node --import tsx scripts/productionReadinessGate.ts

  deploy:
    name: Deploy
    needs: [build, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Call the deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::DEPLOY_HOOK_URL is not set for the production environment"; exit 1
          fi
          echo "::add-mask::$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL" \
            -H 'content-type: application/json' \
            -d "{\"image_tag\":\"$IMAGE_TAG\",\"repository\":\"$GITHUB_REPOSITORY\"}"
