name: Mobile CI

on:
  push:
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck -w @qyou/mobile

      - name: Lint
        run: npm run lint -w @qyou/mobile

      - name: Test
        run: npm run test -w @qyou/mobile

      - name: Build dev client artifact (dry-run / export)
        if: github.event_name == 'pull_request'
        run: |
          echo "Building Expo development client artifact bundle for PR validation"
          npx expo export --no-bytecode --output-dir apps/mobile/dist || true

      - name: Archive mobile dev artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-dev-client
          path: apps/mobile/dist
          if-no-files-found: ignore
